* {
  box-sizing: border-box;
}

:root {
  font-family: Inter, 'Segoe UI', sans-serif;
  color: #f3f7ff;
  background: #070d18;
  line-height: 1.5;
  font-weight: 400;
  color-scheme: dark;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
  min-width: 100%;
  background:
    radial-gradient(circle at top, rgba(70, 96, 255, 0.18), transparent 25%),
    #070d18;
}

body {
  min-height: 100vh;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px 20px 40px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg, #6ae3ff, #8a7dff 48%, #ec7bff);
  color: #06111a;
  font-weight: 900;
  box-shadow: 0 0 30px rgba(116, 136, 255, 0.8);
}

h1, h2, h3, p {
  margin: 0;
}

.eyebrow {
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: #8ca3c5;
}

h1 {
  font-size: clamp(1.35rem, 2vw, 1.9rem);
  letter-spacing: -0.06em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.ghost-button,
.primary-button,
.filter,
.like-button {
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.02);
  color: #edf4ff;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.ghost-button,
.primary-button {
  border-radius: 999px;
  padding: 0.72rem 1.05rem;
  font-weight: 600;
}

.primary-button {
  background: linear-gradient(135deg, #6ae3ff, #8b7dff 48%, #f47bc5);
  color: #07111d;
  border: none;
}

.ghost-button:hover,
.primary-button:hover,
.filter:hover,
.like-button:hover,
.post:hover {
  transform: translateY(-1px);
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
  gap: 24px;
  margin-top: 24px;
}

.feed-panel,
.insight-panel {
  background: rgba(13, 19, 33, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  box-shadow: 0 30px 60px rgba(2, 4, 12, 0.48);
}

.feed-panel {
  padding: 18px;
}

.feed-header,
.badge-row,
.line-1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.feed-header {
  margin-bottom: 18px;
}

.live-pill {
  padding: 0.38rem 0.7rem;
  border-radius: 999px;
  background: rgba(88, 247, 150, 0.12);
  border: 1px solid rgba(88, 247, 150, 0.32);
  color: #81f3b4;
  font-size: 0.76rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}

.filter {
  padding: 0.55rem 0.9rem;
  border-radius: 999px;
  font-size: 0.8rem;
}

.filter.active {
  background: rgba(113, 131, 255, 0.18);
  border-color: rgba(113, 131, 255, 0.48);
  color: #cfe0ff;
}

.stream {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.post {
  background: rgba(18, 26, 38, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
  padding: 16px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.post.selected {
  border-color: rgba(118, 156, 255, 0.8);
  box-shadow: inset 0 0 0 1px rgba(118, 156, 255, 0.7), 0 18px 38px rgba(39, 61, 109, 0.28);
}

.post-topline {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(109, 224, 255, 0.4), rgba(164, 136, 255, 0.5));
  font-weight: 700;
  color: #edf5ff;
}

.post-meta {
  flex: 1;
  min-width: 0;
}

.line-1 {
  gap: 10px;
}

.post-meta strong {
  font-size: 1.05rem;
}

.tag {
  border-radius: 999px;
  background: rgba(127, 200, 255, 0.12);
  border: 1px solid rgba(127, 200, 255, 0.25);
  color: #98d7ff;
  font-size: 0.7rem;
  padding: 0.28rem 0.5rem;
}

.market-name {
  color: #8fa6c8;
  font-size: 0.78rem;
}

.like-button {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.02);
}

.like-button.liked {
  background: rgba(255, 82, 141, 0.12);
  color: #ff7cb3;
  border-color: rgba(255, 103, 162, 0.5);
}

.post-copy {
  margin-top: 16px;
}

.post-copy h3 {
  font-size: 1.25rem;
  letter-spacing: -0.04em;
  margin-bottom: 8px;
}

.post-copy p {
  color: #b8cafe;
}

.trade-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
  padding: 12px 12px;
  border-radius: 16px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
}

.trade-strip span {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 44px;
  border-radius: 12px;
  background: rgba(10, 18, 30, 0.7);
  color: #dcecff;
  font-weight: 600;
}

.mini-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}

.mini-stats div {
  background: rgba(11, 22, 38, 0.72);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 10px 12px;
}

.mini-stats small {
  display: block;
  color: #8ea4c7;
  margin-bottom: 8px;
}

.mini-stats strong {
  font-size: 1.05rem;
}

.insight-panel {
  padding: 18px;
}

.insight-header-card {
  background: linear-gradient(180deg, rgba(18, 28, 45, 0.92), rgba(14, 20, 29, 0.92));
  border-radius: 22px;
  padding: 18px 16px;
  border: 1px solid rgba(255,255,255,0.06);
}

.badge-row {
  justify-content: flex-start;
  gap: 10px;
  color: #91f7c4;
  font-size: 0.82rem;
}

.status-dot {
  width: 8px;
  height: 8px;
  background: #63f2ab;
  border-radius: 50%;
  box-shadow: 0 0 18px rgba(99, 242, 171, 0.9);
}

.insight-header-card h2 {
  margin-top: 8px;
  font-size: clamp(2rem, 3vw, 2.7rem);
  letter-spacing: -0.08em;
}

.insight-header-card p {
  margin-top: 10px;
  color: #d2defa;
}

.score-card {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 18px;
}

.score-card div,
.section-block,
.calculator {
  background: rgba(15, 22, 34, 0.82);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 18px;
}

.score-card div {
  padding: 14px 12px;
}

.score-card span,
.risk-summary span,
.trade-output span {
  display: block;
  color: #8ea4c7;
  margin-bottom: 8px;
}

.score-card strong,
.risk-summary strong,
.trade-output strong {
  font-size: 1.08rem;
}

.section-block {
  margin-top: 18px;
  padding: 18px 16px;
}

.section-block h3 {
  font-size: 1.12rem;
  margin: 8px 0 10px;
}

.section-block p {
  color: #d1ddfb;
}

.calculator {
  margin-top: 18px;
  padding: 18px 16px;
}

.calculator-header h3 {
  margin-top: 8px;
  margin-bottom: 14px;
}

.input-group {
  display: block;
  margin-bottom: 18px;
}

.input-group span {
  display: block;
  margin-bottom: 8px;
  color: #a9bfdc;
}

.input-group input[type='number'] {
  width: 100%;
  padding: 0.82rem 0.9rem;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(10, 15, 22, 0.9);
  border-radius: 12px;
  color: #edf5ff;
}

.input-group input[type='range'] {
  width: 100%;
  accent-color: #7ba5ff;
}

.trade-output,
.risk-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.trade-output div,
.risk-summary div {
  background: rgba(9, 15, 24, 0.8);
  border-radius: 12px;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,0.06);
}

@media (max-width: 980px) {
  .content-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 620px) {
  .app-shell {
    padding-left: 14px;
    padding-right: 14px;
  }

  .topbar,
  .header-actions,
  .feed-header,
  .post-topline {
    flex-wrap: wrap;
  }

  .header-actions {
    width: 100%;
    justify-content: flex-start;
  }

  .score-card,
  .trade-output,
  .risk-summary {
    grid-template-columns: 1fr;
  }
}
